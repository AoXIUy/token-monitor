name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify release tag and reviewed notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const version = require('./package.json').version;
          const tag = 'v' + version;
          const manualMain = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch'
            && process.env.GITHUB_REF_TYPE === 'branch' && process.env.GITHUB_REF_NAME === 'main';
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)
            || (!manualMain && process.env.GITHUB_REF_NAME !== tag)
            || !fs.existsSync('docs/releases/' + version + '.md')) throw Error('Release source, tag and reviewed notes must match');
          const existing = spawnSync('git', ['rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], { encoding: 'utf8' });
          if (existing.status === 0 && existing.stdout.trim() !== process.env.GITHUB_SHA) throw Error('Version tag belongs to another commit; choose a fresh version');
          NODE
      - run: npm run verify

  build:
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            dist_script: dist:win
            artifact_name: token-monitor-win
            artifact_path: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
          - os: ubuntu-latest
            target: linux
            dist_script: dist:linux
            artifact_name: token-monitor-linux
            artifact_path: |
              dist/*.deb
              dist/latest-linux.yml
              dist/*.blockmap
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Platform evidence
        run: node -p "process.platform + '-' + process.arch"
      - run: npm ci
      # Bridges DeepSeek Harness (dsh) support merged upstream but not yet in
      # a tagged tokscale npm release — see scripts/vendor/tokscale.json's
      # "reason" (and "mode", once that release lands).
      # Must run before any platform packaging step (dist:*, dist:win:dir):
      # those bundle whatever bytes are on disk under node_modules/@tokscale
      # at the time they run.
      - name: Ensure vendored tokscale (DSH bridge)
        run: node scripts/ensure-vendored-tokscale.js
      - name: Verify vendored tokscale (DSH bridge)
        run: node scripts/verify-vendored-tokscale.js
      - name: Verify Electron packaging version
        run: |
          node -e "const config = require('./scripts/electron-builder.config.js'); const installed = require('electron/package.json').version; const effective = config.electronVersion || installed; const expected = process.env.TOKEN_MONITOR_LINUX_ELECTRON_VERSION || installed; console.log('Electron packaging version:', effective, '(installed:', installed + ')'); if (effective !== expected) throw new Error('Electron packaging version mismatch: expected ' + expected + ', got ' + effective);"
      - name: Build Linux amd64 Debian package
        if: matrix.target == 'linux'
        run: npm run ${{ matrix.dist_script }}
      - name: Verify Debian identity and architecture
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          deb="dist/Token-Monitor-$version-amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = token-monitor
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
      - name: Build unsigned Windows installer and portable application
        if: matrix.target == 'win'
        run: npm run ${{ matrix.dist_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Windows unsigned release identity
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $files = @('dist/win-unpacked/Token Monitor.exe', "dist/Token-Monitor-Setup-$version.exe", "dist/Token-Monitor-$version.exe")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file -ErrorAction Stop
            Write-Output "$file — Authenticode: $($signature.Status) (unsigned fork release)"
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned fork executable: $file"
            }
          }
      - name: Verify packaged update repository
        shell: bash
        env:
          UPDATE_CONFIG: ${{ matrix.target == 'win' && 'dist/win-unpacked/resources/app-update.yml' || 'dist/linux-unpacked/resources/app-update.yml' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const asar = require('@electron/asar');
          const { load } = require('js-yaml');
          const config = load(fs.readFileSync(process.env.UPDATE_CONFIG, 'utf8'));
          if (config.provider !== 'github' || config.owner !== 'AoXIUy' || config.repo !== 'token-monitor') {
            throw Error('Packaged update provider must point to this fork');
          }
          if (process.platform === 'win32' && config.publisherName) {
            throw Error('Unsigned Windows releases must not claim a signing publisher');
          }
          const archive = path.join(path.dirname(process.env.UPDATE_CONFIG), 'app.asar');
          const metadata = JSON.parse(asar.extractFile(archive, 'package.json'));
          const context = { module: { exports: {} }, URL,
            require: id => id === '../../package.json' ? metadata : require(id) };
          vm.runInNewContext(asar.extractFile(archive, path.join('src', 'shared', 'appUpdater.js')).toString(), context);
          if (context.module.exports.RELEASES_LATEST_URL !== 'https://github.com/AoXIUy/token-monitor/releases/latest') {
            throw Error('Packaged updater does not load or points to another repository');
          }
          NODE
      - name: Verify updater artifact names
        run: npm run verify:release-artifact-names
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: token-monitor-*
      - name: Stage Windows and Linux release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -e "release-artifacts/$name" ]; then
              echo "duplicate release artifact: $name" >&2
              exit 1
            fi
            cp "$file" "release-artifacts/$name"
          done < <(find artifacts -mindepth 2 -type f -print0)
          node scripts/verify-updater-artifact-names.js release-artifacts
      - name: Prepare reviewed release notes
        id: version
        run: node -e "const fs=require('node:fs'); const version=require('./package.json').version; fs.copyFileSync('docs/releases/'+version+'.md','release-notes.md'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag=v'+version+'\n')"
      - name: Record artifact integrity and source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const dir = 'release-artifacts';
          const assets = fs.readdirSync(dir).sort().map(name => ({ name,
            sha256: crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, name))).digest('hex') }));
          fs.writeFileSync(path.join(dir, 'SHA256SUMS'), assets.map(a => a.sha256+'  '+a.name).join('\n')+'\n');
          fs.writeFileSync(path.join(dir, 'release-metadata.json'), JSON.stringify({version: require('./package.json').version,
            tag: 'v'+require('./package.json').version, commit: process.env.GITHUB_SHA,
            platforms: ['windows-x64', 'linux-deb-amd64'], windowsSigning: 'unsigned', assets}, null, 2)+'\n');
          NODE
      - name: Create or resume source-matched draft
        id: draft
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');
            const version = require('./package.json').version;
            const tag = 'v' + version;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) {
              if (!release.draft || release.target_commitish !== context.sha) {
                throw Error('Existing release is public or belongs to another source commit; choose a fresh version');
              }
            } else {
              release = (await github.rest.repos.createRelease({...context.repo,
                tag_name: tag, target_commitish: context.sha, name: 'Token Monitor ' + version,
                body: fs.readFileSync('release-notes.md', 'utf8'), draft: true, make_latest: 'false'})).data;
            }
            core.setOutput('release_id', release.id);
      - name: Upload complete release assets to draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
          body_path: release-notes.md
      - name: Verify uploads and publish latest
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const id = Number('${{ steps.draft.outputs.release_id }}');
            const release = (await github.rest.repos.getRelease({...context.repo, release_id: id})).data;
            if (!release.draft || release.target_commitish !== context.sha) throw Error('Release changed during upload');
            const dir = 'release-artifacts';
            const expected = fs.readdirSync(dir).sort();
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: id, per_page: 100});
            if (JSON.stringify(assets.map(a => a.name).sort()) !== JSON.stringify(expected)) throw Error('Release assets are incomplete');
            for (const asset of assets) {
              if (asset.state !== 'uploaded' || asset.size !== fs.statSync(path.join(dir, asset.name)).size) throw Error('Incomplete asset: ' + asset.name);
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: id, draft: false, prerelease: false, make_latest: 'true'});
